[package]
name = "grsott"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bunyarrs = "0.3"
crc = "3"
hex = "0.4"
itertools = "0.14"
log = "0.4.29"
mqtt-reeze = "0.3"
pcap-file = "3.0.0-rc1"
pretty_env_logger = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-default-headers = "0.2"
tracing-subscriber = "0.3"

[[bin]]
name = "proxy"
path = "src/bin/proxy.rs"
